<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Sport Club Córdoba</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap');

  :root {
    --rojo:    #CC1F26;
    --rojo2:   #E8222A;
    --amarillo:#F5C800;
    --negro:   #0D0D0D;
    --blanco:  #FFFFFF;
    --gris:    #F0F0F0;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    height: 100%;
    background: var(--negro);
    font-family: 'Barlow', sans-serif;
    overflow-x: hidden;
  }

  /* ════════════════════════════════
     PÁGINA PRINCIPAL
  ════════════════════════════════ */
  .page {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--negro);
  }

  /* Franja roja superior */
  .hero {
    width: 100%;
    background: var(--rojo);
    padding: 40px 24px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 24px;
    background: var(--negro);
    clip-path: ellipse(55% 100% at 50% 100%);
  }

  /* Deco cruz */
  .hero-cruz {
    position: absolute;
    top: 18px; right: 22px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 38px;
    font-weight: 900;
    color: var(--amarillo);
    opacity: 0.7;
    line-height: 1;
  }

  .hero-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    margin-bottom: 10px;
  }

  .hero-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }

  .sc-circle {
    width: 48px; height: 48px;
    background: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .sc-circle svg { width: 32px; height: 32px; }

  .hero-brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 46px;
    font-weight: 900;
    color: white;
    line-height: 1;
    letter-spacing: 1px;
  }

  .hero-brand span { color: var(--amarillo); }


  /* Logo real */
  .hero-logo-img {
    display: block;
    width: 240px;
    max-width: 68vw;
    height: auto;
    margin: 4px 0 6px;
    object-fit: contain;
    /* logo tiene fondo negro — lo dejamos sobre el rojo con un blend */
    mix-blend-mode: screen;
    filter: brightness(1.05);
  }

  .hero-cordoba {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-top: 4px;
  }

  /* Sección sedes */
  .sedes-section {
    width: 100%;
    padding: 32px 20px 40px;
  }

  .sedes-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    text-align: center;
    margin-bottom: 16px;
  }

  .sedes-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    max-width: 380px;
    margin: 0 auto;
  }

  /* Card sede activa */
  .sede-card {
    background: #1A1A1A;
    border: 1.5px solid #2A2A2A;
    border-radius: 16px;
    padding: 20px 14px 16px;
    cursor: pointer;
    transition: transform 0.13s, border-color 0.13s, background 0.13s;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .sede-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--rojo);
    transform: scaleX(0);
    transition: transform 0.2s;
    transform-origin: left;
  }

  .sede-card:active {
    transform: scale(0.96);
    border-color: var(--rojo);
    background: #1F1010;
  }
  .sede-card:active::before { transform: scaleX(1); }

  /* Card "próximamente" */
  .sede-card.proximamente {
    opacity: 0.5;
    cursor: default;
    pointer-events: none;
  }

  .prox-badge {
    position: absolute;
    top: 10px; right: 10px;
    background: var(--amarillo);
    color: var(--negro);
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 999px;
  }

  .sede-icon { font-size: 28px; margin-bottom: 8px; display: block; }

  .sede-nombre {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: white;
    line-height: 1.1;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .sede-barrio {
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.4);
    margin-top: 3px;
    letter-spacing: 0.5px;
  }

  .play-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #2A2A2A;
  }

  .play-btn {
    width: 22px; height: 22px;
    background: var(--rojo);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  .play-btn svg { width: 9px; margin-left: 1px; }

  .play-text {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ════════════════════════════════
     MODAL
  ════════════════════════════════ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.96);
    z-index: 999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow-y: auto;
  }

  .modal-overlay.active { display: flex; }

  .modal-box {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  .modal-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    flex-shrink: 0;
  }

  .modal-pill {
    background: var(--rojo);
    color: white;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 999px;
  }

  .btn-close {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #1E1E1E;
    border: 1.5px solid #333;
    color: rgba(255,255,255,0.6);
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    padding-bottom: 2px;
  }

  /* Video 16:9 */
  .video-wrap {
    width: 100%;
    position: relative;
    background: #000;
  }
  .video-wrap::before {
    content: '';
    display: block;
    padding-top: 56.25%;
  }
  .video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    border: none;
    display: block;
  }

  /* Franja amarilla bajo video */
  .video-strip {
    width: 100%;
    background: var(--amarillo);
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .strip-pin { font-size: 16px; }

  .strip-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: var(--negro);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* CTA */
  .cta-block {
    flex: 1;
    padding: 24px 20px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .cta-super {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: white;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.1;
  }

  .cta-super span { color: var(--amarillo); }

  .cta-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    text-align: center;
    margin-bottom: 6px;
  }

  .btn-wp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 340px;
    padding: 18px 24px;
    background: #25D366;
    border-radius: 14px;
    text-decoration: none;
    color: white;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    box-shadow: 0 8px 28px rgba(37,211,102,0.3);
    transition: transform 0.12s;
  }

  .btn-wp:active { transform: scale(0.97); }
  .btn-wp svg { width: 26px; flex-shrink: 0; }

  .wp-note {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Steps */
  .steps-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .step-num {
    width: 28px; height: 28px;
    background: var(--rojo);
    border-radius: 50%;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 900;
    color: white;
    display: flex; align-items: center; justify-content: center;
  }

  .step-label {
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    text-align: center;
    max-width: 56px;
    line-height: 1.2;
  }

  .step-line {
    width: 28px;
    height: 1px;
    background: #333;
    margin-bottom: 14px;
  }

  /* ════════════════════════════════
     MOBILE — iPhone 11 Pro base (375×812)
     Safe areas para notch y home bar
  ════════════════════════════════ */

  @supports (padding-top: env(safe-area-inset-top)) {
    .hero {
      padding-top: calc(40px + env(safe-area-inset-top));
    }
    .modal-topbar {
      padding-top: calc(18px + env(safe-area-inset-top));
    }
    .cta-block {
      padding-bottom: calc(36px + env(safe-area-inset-bottom));
    }
  }

  /* Base móvil — max 430px (iPhone 14 Pro Max) */
  @media (max-width: 430px) {

    .hero {
      padding: 44px 20px 36px;
    }

    .hero-eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
    }

    .hero-logo-img {
      width: 210px;
    }

    .hero-cordoba {
      font-size: 12px;
      letter-spacing: 4px;
    }

    .sedes-section {
      padding: 24px 16px 32px;
    }

    .sedes-grid {
      gap: 9px;
    }

    .sede-card {
      padding: 16px 12px 14px;
      border-radius: 14px;
    }

    .sede-icon { font-size: 24px; margin-bottom: 6px; }

    .sede-nombre {
      font-size: 18px;
    }

    .sede-barrio {
      font-size: 10px;
    }

    .play-row {
      margin-top: 10px;
      padding-top: 8px;
    }

    /* Modal en móvil */
    .modal-topbar {
      padding: 16px 16px 10px;
    }

    .modal-pill {
      font-size: 12px;
      padding: 5px 12px;
    }

    .btn-close {
      width: 34px; height: 34px;
      font-size: 20px;
    }

    .video-strip {
      padding: 7px 16px;
    }

    .strip-text {
      font-size: 13px;
    }

    .cta-block {
      padding: 20px 16px 40px;
      gap: 8px;
    }

    .cta-super {
      font-size: 24px;
    }

    .cta-sub {
      font-size: 12px;
    }

    .btn-wp {
      font-size: 18px;
      padding: 16px 20px;
      border-radius: 12px;
      max-width: 100%;
    }

    .steps-row {
      gap: 6px;
    }

    .step-num {
      width: 26px; height: 26px;
      font-size: 14px;
    }

    .step-label {
      font-size: 9px;
      max-width: 50px;
    }

    .step-line {
      width: 22px;
    }
  }

  /* iPhone SE / pequeños — 320px */
  @media (max-width: 340px) {
    .hero-logo-img { width: 170px; }
    .sede-nombre { font-size: 15px; }
    .sedes-grid { gap: 7px; }
    .cta-super { font-size: 21px; }
    .btn-wp { font-size: 16px; padding: 14px 16px; }
  }

</style>
</head>

  document.getElementById('modalPill').textContent = `SEDE ${sede.nombre.toUpperCase()}`;
  document.getElementById('stripText').textContent = `Sport Club · Sede ${sede.nombre}`;

  const src = `https://www.youtube.com/embed/${sede.videoId}?autoplay=1&mute=1&rel=0&modestbranding=1&playsinline=1&controls=1&loop=1&playlist=${sede.videoId}`;
  document.getElementById('videoFrame').src = src;

  const msg = encodeURIComponent(`Hola! Pasé por la Sede ${sede.nombre}, escaneé el QR y me gustaría tener info para empezar 💪🚀`);
  document.getElementById('btnWP').href = `https://wa.me/${WP_NUM}?text=${msg}`;

  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

// ── Cerrar modal ──
function cerrarModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('videoFrame').src = '';
  document.body.style.overflow = '';
}

document.getElementById('btnClose').addEventListener('click', cerrarModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) cerrarModal();
});

// ── QR directo: ?sede=estrada abre el video automáticamente ──
const p = new URLSearchParams(window.location.search);
const sp = p.get('sede');
if (sp) {
  const match = SEDES.find(s => s.id === sp.toLowerCase() && s.activa);
  if (match) setTimeout(() => abrirSede(match), 350);
}
</script>
